name: Compile VeloStrap via Nuitka

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            # Install common modules that may be missing
            pip install requests
          }
        shell: powershell

      - name: Build with Nuitka
        run: |
          nuitka --standalone --windows-console-mode=disable --output-dir=build --include-package=requests --include-package=customtkinter --enable-plugin=tk-inter --include-data-dir=assets=assets VeloStrap.py
        shell: powershell

      - name: Create ZIP
        run: |
          Compress-Archive -Path build\VeloStrap.dist\* -DestinationPath VeloStrap_${{ github.ref_name }}.zip
        shell: powershell

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: VeloStrap_${{ github.ref_name }}.zip

      - name: Send Discord Notification
        run: |
          $body = @{
            content = "🚀 **New VeloStrap Release (Stable or not) Ready!**`nVersion: ${{ github.ref_name }}`n# 📁 Download`nDownload the latest version from either the official Github(https://github.com/NewPythonX-NPX/VeloStrap/releases) or itch.io(https://newpythonx.itch.io/velostrap-npx) (P.S itch.io won't get snapshot releases)"
          } | ConvertTo-Json -Depth 1
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK_URL -Method Post -Body $body -ContentType "application/json"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: powershell

      - name: Download Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default
          Expand-Archive butler.zip -DestinationPath .
        shell: powershell

      - name: Deploy to Itch
        run: |
          ./butler push VeloStrap_${{ github.ref_name }}.zip newpythonx/velostrap-npx:windows --userversion ${{ github.ref_name }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: powershell
