name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  PYTHON_DEPS: "customtkinter requests pillow pypresence pyinstaller"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip ${{ env.PYTHON_DEPS }}

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name VeloStrap `
            --hidden-import requests `
            --hidden-import customtkinter `
            --collect-data customtkinter `
            --add-data "assets;assets" `
            --add-data "IMPORTANT;IMPORTANT" `
            --add-data "Mods;Mods" `
            --add-data "Me_lo;Me_Lo" `
            VeloStrap.py
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -LiteralPath "dist\VeloStrap.exe" -Destination "release\VeloStrap-windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: velostrap-windows
          path: release/VeloStrap-windows.exe

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip ${{ env.PYTHON_DEPS }}

      - name: Build macOS app
        run: |
          python -m PyInstaller --noconfirm --windowed \
            --name VeloStrap \
            --hidden-import requests \
            --hidden-import customtkinter \
            --collect-data customtkinter \
            --add-data "assets:assets" \
            --add-data "IMPORTANT:IMPORTANT" \
            --add-data "Mods:Mods" \
            --add-data "Me_lo:Me_Lo" \
            VeloStrap.py
          hdiutil create -volname "VeloStrap" -srcfolder "dist/VeloStrap.app" -ov -format UDZO "VeloStrap-macOS.dmg"
          mkdir -p release
          cp "VeloStrap-macOS.dmg" "release/VeloStrap-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: velostrap-macos
          path: release/VeloStrap-macOS.dmg

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk fakeroot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip ${{ env.PYTHON_DEPS }}

      - name: Build Linux executable
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
            --name VeloStrap \
            --hidden-import requests \
            --hidden-import customtkinter \
            --collect-data customtkinter \
            VeloStrap.py
          mkdir -p package/DEBIAN package/usr/local/bin package/usr/share/applications
          cp dist/VeloStrap package/usr/local/bin/velostrap
          chmod 755 package/usr/local/bin/velostrap
          cat > package/DEBIAN/control <<'EOF'
          Package: velostrap
          Version: 0.2.0
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: NewPythonX Studio
          Description: Experimental VeloStrap launcher for Roblox on Linux via Sober.
          EOF
          sed -i 's/^          //' package/DEBIAN/control
          cat > package/usr/share/applications/velostrap.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=VeloStrap
          Exec=/usr/local/bin/velostrap
          Terminal=false
          Categories=Game;Utility;
          EOF
          sed -i 's/^          //' package/usr/share/applications/velostrap.desktop
          fakeroot dpkg-deb --build package VeloStrap-linux-amd64.deb
          mkdir -p release
          cp VeloStrap-linux-amd64.deb release/VeloStrap-linux-amd64.deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: velostrap-linux
          path: release/VeloStrap-linux-amd64.deb

  source-archive:
    name: Create source archive
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source zip
        run: |
          zip_name="VeloStrap-${{ github.ref_name }}-source.zip"
          git archive --format zip --output "$zip_name" HEAD
          mkdir -p release
          cp "$zip_name" release/

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: velostrap-source
          path: release/VeloStrap-*-source.zip

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
      - source-archive

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/velostrap-windows/VeloStrap-windows.exe
            release-assets/velostrap-macos/VeloStrap-macOS.dmg
            release-assets/velostrap-linux/VeloStrap-linux-amd64.deb
            release-assets/velostrap-source/release/VeloStrap-*-source.zip
