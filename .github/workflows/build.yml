name: Compile VeloStrap via PyInstaller

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # Fixed: 3.14 not available yet

      - run: pip install pyinstaller

      - run: pyinstaller --onefile --clean --distpath . VeloStrap.py

      # Create ZIP containing only the executable (cleaner release)
      - name: Create ZIP
        run: |
          powershell Compress-Archive -Path VeloStrap.exe -DestinationPath VeloStrap_${{ github.ref_name }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: VeloStrap_${{ github.ref_name }}.zip

      # Notify after release is actually created and asset uploaded
      - name: Send Release Discord
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" `
            -H "Content-Type: application/json" `
            -d "{ \"content\": \"🚀 **New VeloStrap Release (Stable or not) Ready!**\nVersion: ${{ github.ref_name }}\n# 📁 Download\nDownload the latest version from either the official Github(https://github.com/NewPythonX-NPX/VeloStrap/releases) or itch.io(https://newpythonx.itch.io/velostrap-npx) (P.S itch.io won't get snapshot releases)\" }"
        shell: powershell

      - name: Download Butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default
          Expand-Archive butler.zip -DestinationPath .

      # Push the raw executable to itch.io for a cleaner, direct download
      - name: Deploy to Itch
        run: |
          ./butler push VeloStrap.exe newpythonx/velostrap-npx:windows --userversion ${{ github.ref_name }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
