name: Compile VeloStrap via PyInstaller

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            pip install requests customtkinter
          }
        shell: powershell

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --hidden-import requests --hidden-import ctk --clean VeloStrap.py
        shell: powershell

      - name: Create ZIP
        run: |
          Compress-Archive -Path * -DestinationPath VeloStrap_${{ github.ref_name }}.zip
        shell: powershell

      - name: Upload Zip To Github
        uses: softprops/action-gh-release@v1
        with:
          files: VeloStrap_${{ github.ref_name }}.zip
